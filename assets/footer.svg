.h0{fill:#f0f6fc;fill-opacity:.08}.h1{fill:#f0f6fc;fill-opacity:.3}.h2{fill:#f0f6fc;fill-opacity:.52}.h3{fill:#f0f6fc;fill-opacity:.76}.h4{fill:#f0f6fc;fill-opacity:1}
.tk{fill:#f0f6fc;fill-opacity:.1;stroke:#f0f6fc}
