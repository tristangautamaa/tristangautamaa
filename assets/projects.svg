<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 686" width="800" height="686" role="img" aria-label="More projects: Seaport, NawarX, GISEU, ZEAT app and Zero-EAT">
<title>More projects: Seaport, NawarX, GISEU, ZEAT app and Zero-EAT</title>
<style>@font-face{font-family:"Unbounded";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.fd{font-family:"Unbounded","Arial Black",Impact,sans-serif;font-weight:700}@font-face{font-family:"Instrument Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.fs{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400}@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}.fm{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500}@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.fmb{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.fg{fill:#233D4D}.mu{fill:#4F7690}.ac{fill:#C2570A}.acf{fill:#FE7F2D}
.sfg{stroke:#233D4D}.slm{stroke:#233D4D;stroke-opacity:.2}.ffg{fill:#233D4D}.flm{fill:#233D4D;fill-opacity:.08}
@media (prefers-color-scheme:dark){
.fg{fill:#EAF1F6}.mu{fill:#6594B1}.ac{fill:#FE7F2D}
.sfg{stroke:#EAF1F6}.slm{stroke:#EAF1F6;stroke-opacity:.2}.ffg{fill:#EAF1F6}.flm{fill:#EAF1F6;fill-opacity:.08}
}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sweep{0%{transform:scaleX(.08)}70%,100%{transform:scaleX(1)}}
@keyframes shimmer{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes ring{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
.floaty{animation:floaty 5s ease-in-out infinite}
.fadeup{animation:fadeup .7s ease-out both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s ease-out both}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s ease-out both}
.sweep{transform-box:fill-box;transform-origin:left center;animation:sweep 3.2s ease-in-out infinite alternate}
.shim{animation:shimmer 3.6s ease-in-out infinite}
.ring{animation:ring 1.4s ease-out both}
.dt{animation:dots 1.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs></defs>
<text x="12.0" y="14.0" font-size="11" class="fmb ac" letter-spacing="3">05 / PROJECTS</text>
<text x="12.0" y="50.0" font-size="26" class="fd fg">More projects</text>
<text x="788.0" y="48.0" font-size="13" class="fs mu" text-anchor="end">Internal tools and earlier builds</text>
<rect x="12" y="62" width="776" height="1.5" class="slm" fill="none"/>
<rect x="12" y="61.5" width="231" height="2.5" rx="1" class="acf"/>
<text x="12.0" y="114.0" font-size="11" class="fmb ac" letter-spacing="1">01</text>
<text x="46.0" y="115.0" font-size="13" class="fd fg">SEAPORT — VENDOR EKSPEDISI KLG</text>
<rect x="711" y="102" width="77" height="20" rx="10" class="slm" fill="none"/>
<text x="749.4" y="116.0" font-size="9" class="fmb mu" text-anchor="middle" letter-spacing="2">INTERNAL</text>
<text x="46.0" y="140.0" font-size="13.5" class="fs fg">Internal freight-tariff portal: imports vendor RFQ spreadsheets, matches them to master data, keeps monthly rates with</text>
<text x="46.0" y="160.0" font-size="13.5" class="fs fg">full revision history and compares vendors lane by lane.</text>
<text x="46.0" y="186.0" font-size="9.5" class="fm mu" letter-spacing="0.8">NEXT.JS · REACT · TAILWIND · RADIX UI · SHEETJS</text>
<rect x="12" y="204" width="776" height="1" class="slm"/>
<text x="12.0" y="242.0" font-size="11" class="fmb ac" letter-spacing="1">02</text>
<text x="46.0" y="243.0" font-size="13" class="fd fg">NAWARX</text>
<rect x="711" y="230" width="77" height="20" rx="10" class="slm" fill="none"/>
<text x="749.4" y="244.0" font-size="9" class="fmb mu" text-anchor="middle" letter-spacing="2">INTERNAL</text>
<text x="46.0" y="268.0" font-size="13.5" class="fs fg">Billboard (OOH) intelligence tool: a price database, a price calculator and a negotiation advisor that benchmarks quotes</text>
<text x="46.0" y="288.0" font-size="13.5" class="fs fg">against deal history and maps nearby sites and vendors.</text>
<text x="46.0" y="314.0" font-size="9.5" class="fm mu" letter-spacing="0.8">VITE · TYPESCRIPT · LEAFLET · SUPABASE · PYTHON</text>
<rect x="12" y="332" width="776" height="1" class="slm"/>
<text x="12.0" y="370.0" font-size="11" class="fmb ac" letter-spacing="1">03</text>
<text x="46.0" y="371.0" font-size="13" class="fd fg">GISEU</text>
<text x="46.0" y="396.0" font-size="13.5" class="fs fg">Editorial fashion site in a quiet-luxury, modern-Japanese-minimal style: one continuous smooth-scrolling page with a</text>
<text x="46.0" y="416.0" font-size="13.5" class="fs fg">fullscreen rolling-text navigation.</text>
<text x="46.0" y="442.0" font-size="9.5" class="fm mu" letter-spacing="0.8">VITE · REACT · TYPESCRIPT · FRAMER MOTION · GSAP · LENIS</text>
<rect x="12" y="460" width="776" height="1" class="slm"/>
<text x="12.0" y="498.0" font-size="11" class="fmb ac" letter-spacing="1">04</text>
<text x="46.0" y="499.0" font-size="13" class="fd fg">ZEAT APP</text>
<text x="46.0" y="524.0" font-size="13.5" class="fs fg">Food-ordering app with menu, cart, pickup and delivery tracking, an admin dashboard and a chatbot.</text>
<text x="46.0" y="550.0" font-size="9.5" class="fm mu" letter-spacing="0.8">FLUTTER · DART · FIREBASE</text>
<rect x="12" y="568" width="776" height="1" class="slm"/>
<text x="12.0" y="606.0" font-size="11" class="fmb ac" letter-spacing="1">05</text>
<text x="46.0" y="607.0" font-size="13" class="fd fg">ZERO-EAT</text>
<text x="46.0" y="632.0" font-size="13.5" class="fs fg">Laravel web app with user registration, login, profiles and a product catalog.</text>
<text x="46.0" y="658.0" font-size="9.5" class="fm mu" letter-spacing="0.8">LARAVEL · PHP · BLADE · TAILWIND</text>
<rect x="12" y="676" width="776" height="1" class="slm"/>
</svg>
