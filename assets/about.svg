<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" width="800" height="278" role="img" aria-label="About Tristan: student in Jakarta, data analyst intern, builder of websites, apps and internal tools">
<title>About Tristan: student in Jakarta, data analyst intern, builder of websites, apps and internal tools</title>
<style>@font-face{font-family:"Unbounded";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.fd{font-family:"Unbounded","Arial Black",Impact,sans-serif;font-weight:700}@font-face{font-family:"Instrument Sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}.fs{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400}@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.fmb{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.fg{fill:#233D4D}.mu{fill:#4F7690}.ac{fill:#C2570A}.acf{fill:#FE7F2D}
.sfg{stroke:#233D4D}.slm{stroke:#233D4D;stroke-opacity:.2}.ffg{fill:#233D4D}.flm{fill:#233D4D;fill-opacity:.08}
@media (prefers-color-scheme:dark){
.fg{fill:#EAF1F6}.mu{fill:#6594B1}.ac{fill:#FE7F2D}
.sfg{stroke:#EAF1F6}.slm{stroke:#EAF1F6;stroke-opacity:.2}.ffg{fill:#EAF1F6}.flm{fill:#EAF1F6;fill-opacity:.08}
}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sweep{0%{transform:scaleX(.08)}70%,100%{transform:scaleX(1)}}
@keyframes shimmer{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes ring{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
.floaty{animation:floaty 5s ease-in-out infinite}
.fadeup{animation:fadeup .7s ease-out both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.draw{stroke-dasharray:1;animation:draw 1.6s ease-out both}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s ease-out both}
.sweep{transform-box:fill-box;transform-origin:left center;animation:sweep 3.2s ease-in-out infinite alternate}
.shim{animation:shimmer 3.6s ease-in-out infinite}
.ring{animation:ring 1.4s ease-out both}
.dt{animation:dots 1.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs></defs>
<text x="12.0" y="14.0" font-size="11" class="fmb ac" letter-spacing="3">01 / ABOUT</text>
<text x="12.0" y="50.0" font-size="26" class="fd fg">About</text>
<text x="788.0" y="48.0" font-size="13" class="fs mu" text-anchor="end">Jakarta, Indonesia</text>
<rect x="12" y="62" width="776" height="1.5" class="slm" fill="none"/>
<rect x="12" y="61.5" width="103" height="2.5" rx="1" class="acf"/>
<text x="12.0" y="102.0" font-size="15.5" class="fs fg">Student at Multimedia Nusantara University in Jakarta.</text>
<text x="12.0" y="128.0" font-size="15.5" class="fs fg">Data analyst intern who also builds websites, apps and internal tools for real businesses.</text>
<text x="12.0" y="154.0" font-size="15.5" class="fs fg">On the side: student research on geospatial machine learning for energy access in Indonesia.</text>
<rect x="12" y="186" width="776" height="1" class="slm"/>
<text x="12.0" y="218.0" font-size="10" class="fmb mu" letter-spacing="2.4">FOCUS</text>
<text x="122.0" y="218.0" font-size="14" class="fs fg">Data Analysis, Machine Learning, Web and AI Integration</text>
<text x="12.0" y="246.0" font-size="10" class="fmb mu" letter-spacing="2.4">BASE</text>
<text x="122.0" y="246.0" font-size="14" class="fs fg">Jakarta, Indonesia</text>
</svg>
