name: Refresh telemetry

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch numbers from GitHub
        env:
          # STATS_TOKEN (optional personal access token from the account owner) sees private
          # contributions; the built-in token only sees public ones.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_data.py

      - name: Regenerate SVGs
        run: python3 scripts/gen.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh telemetry"
            git push
          else
            echo "nothing to commit"
          fi
